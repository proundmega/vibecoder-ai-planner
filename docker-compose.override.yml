services:
  api:
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=development
      - ALLOWED_ORIGINS=http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002
      - ALLOW_PRIVATE_HOSTS=1
      - DOCKER_API_URL=/var/run/docker.sock
      - ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - INTEGRATION_TESTS=1
      # Local development defaults to the explicit PAT fallback until an App is configured.
      - GITHUB_AUTH_MODE=${GITHUB_AUTH_MODE:-pat}
      - ALLOW_PAT=${ALLOW_PAT:-true}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  frontend:
    ports:
      - "3000:80"

  postgres:
    ports:
      - "5432:5432"
