x-ci-labels: &ci-labels
  com.vibecode.ci: "${VIBECODE_CI:-false}"
  com.vibecode.ci.job: "${VIBECODE_CI_JOB:-}"
  com.vibecode.ci.build: "${VIBECODE_CI_BUILD:-}"

services:
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # Pool agents talk to the daemon through this proxy to create sandbox
      # siblings. Keep the raw socket out of the agent and sandbox containers.
      POST: 1
      CONTAINERS: 1
      EXEC: 1
      IMAGES: 1
      INFO: 1
      NETWORKS: 1
      VOLUMES: 1
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
      ALLOW_PAUSE: 1
      ALLOW_UNPAUSE: 1
    # Only the API and Docker-mode pool agents join this internal control
    # network. Host-mode agents and internet-facing services cannot reach the
    # expanded Docker API proxy.
    networks:
      - sandbox-control
    healthcheck:
      # tecnativa/docker-socket-proxy serves Docker API on :2375; /version is a lightweight GET
      # that returns JSON (no redirect), so wget --spider succeeds on TCP+HTTP 200
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 5s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.25'

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels: *ci-labels
    restart: "no"
    networks:
      - default
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vibecode
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: node src/migrations/apply.js
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
      labels: *ci-labels
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - BACKEND_URL=${BACKEND_URL:-http://api:3001}
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vibecode
      - JWT_SECRET=${JWT_SECRET}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3002}
      - DOCKER_API_URL=http://docker-proxy:2375
      - AGENT_IMAGE=${AGENT_IMAGE:-vibecode-agent}
      - CONTAINER_NETWORK=${COMPOSE_PROJECT_NAME:-vibecode}_default
      - REPO_VOLUME=${REPO_VOLUME:-vibecode_repos}
      # Pool agents use the restricted socket proxy, never the raw socket.
      - AGENT_DOCKER_HOST=${AGENT_DOCKER_HOST:-tcp://docker-proxy:2375}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - AGENT_ENROLLMENT_ENABLED=${AGENT_ENROLLMENT_ENABLED:-false}
      - ALLOW_INSECURE_AGENT_ENROLLMENT=${ALLOW_INSECURE_AGENT_ENROLLMENT:-0}
      - TRUST_PROXY=${TRUST_PROXY:-}
      - GITHUB_AUTH_MODE=${GITHUB_AUTH_MODE:-app}
      - ALLOW_PAT=${ALLOW_PAT:-false}
      - GITHUB_APP_ID=${GITHUB_APP_ID:-}
      - GITHUB_APP_PRIVATE_KEY=${GITHUB_APP_PRIVATE_KEY:-}
      - GITHUB_APP_INSTALLATION_ID=${GITHUB_APP_INSTALLATION_ID:-}
      - GITHUB_TOKEN_TTL_SECONDS=${GITHUB_TOKEN_TTL_SECONDS:-3600}
      - SANDBOX_MODE=${SANDBOX_MODE:-host}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-vibecode-agent-sandbox:latest}
      - SANDBOX_PROXY_IMAGE=${SANDBOX_PROXY_IMAGE:-vibecode-sandbox-proxy:latest}
      - SANDBOX_DOCKER_BIN=${SANDBOX_DOCKER_BIN:-docker}
      - SANDBOX_REQUIRE=${SANDBOX_REQUIRE:-false}
      - SANDBOX_REQUIRE_SECURE_FILE_ACCESS=${SANDBOX_REQUIRE_SECURE_FILE_ACCESS:-false}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2.0}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-2048}
      - SANDBOX_PIDS=${SANDBOX_PIDS:-512}
      - SANDBOX_DISK_MB=${SANDBOX_DISK_MB:-5120}
      - SANDBOX_DISK_CHECK_INTERVAL_SECONDS=${SANDBOX_DISK_CHECK_INTERVAL_SECONDS:-10}
      - SANDBOX_DISK_ENFORCE=${SANDBOX_DISK_ENFORCE:-false}
      - SANDBOX_NOFILE=${SANDBOX_NOFILE:-1024}
      - SANDBOX_TMPFS_MB=${SANDBOX_TMPFS_MB:-256}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-none}
      - SANDBOX_ALLOWED_HOSTS=${SANDBOX_ALLOWED_HOSTS:-}
      - SANDBOX_EGRESS_PROXY=${SANDBOX_EGRESS_PROXY:-}
      - SANDBOX_EGRESS_UPSTREAM_NETWORK=${SANDBOX_EGRESS_UPSTREAM_NETWORK:-bridge}
      - SANDBOX_EGRESS_PROBE_TIMEOUT_MS=${SANDBOX_EGRESS_PROBE_TIMEOUT_MS:-5000}
      - SANDBOX_EGRESS_TLS_MODE=${SANDBOX_EGRESS_TLS_MODE:-sni-only}
      - SANDBOX_EGRESS_ORIGIN_CA_HOSTS=${SANDBOX_EGRESS_ORIGIN_CA_HOSTS:-}
      - SANDBOX_EGRESS_ORIGIN_CA_B64=${SANDBOX_EGRESS_ORIGIN_CA_B64:-}
      - SANDBOX_ENV=${SANDBOX_ENV:-}
      - SANDBOX_USER=${SANDBOX_USER:-}
      - SANDBOX_ALLOW_ROOT=${SANDBOX_ALLOW_ROOT:-false}
      - SANDBOX_EXEC_TIMEOUT_SECONDS=${SANDBOX_EXEC_TIMEOUT_SECONDS:-900}
      - SANDBOX_ARTIFACT_MAX_BYTES=${SANDBOX_ARTIFACT_MAX_BYTES:-5242880}
      - SANDBOX_SECCOMP_PROFILE=${SANDBOX_SECCOMP_PROFILE:-}
      - SANDBOX_APPARMOR_PROFILE=${SANDBOX_APPARMOR_PROFILE:-}
      - SANDBOX_CONTAINER_WORKSPACE_ROOT=${SANDBOX_CONTAINER_WORKSPACE_ROOT:-/repos}
      - SANDBOX_HOST_WORKSPACE_ROOT=${SANDBOX_HOST_WORKSPACE_ROOT:-}
      - SANDBOX_CONTROL_NETWORK=${SANDBOX_CONTROL_NETWORK:-${COMPOSE_PROJECT_NAME:-vibecode}-sandbox-control}
      - REDIS_URL=redis://redis:6379
    # Optional GitHub App private key: set
    # GITHUB_APP_PRIVATE_KEY=file:/run/secrets/github-app.pem and mount the file:
    # - ${GITHUB_APP_PRIVATE_KEY_PATH:-./secrets/github-app.pem}:/run/secrets/github-app.pem:ro
    volumes:
      - uploads_data:/app/uploads
      - vibecode_repos:/repos
    networks:
      - default
      - sandbox-control
    depends_on:
      docker-proxy:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      labels: *ci-labels
    restart: unless-stopped
    networks:
      - default
    environment:
      - API_URL=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    networks:
      - default
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    profiles: ["dev"]
    networks:
      - default
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@vibecode.dev
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-changeme}
    depends_on:
      - postgres
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'

networks:
  default:
    driver: bridge
    labels: *ci-labels
  # Dedicated control plane for the restricted Docker socket proxy. Pool
  # agents join it only when SANDBOX_MODE=docker.
  sandbox-control:
    name: ${SANDBOX_CONTROL_NETWORK:-${COMPOSE_PROJECT_NAME:-vibecode}-sandbox-control}
    driver: bridge
    internal: true
    labels: *ci-labels

volumes:
  postgres_data:
    labels: *ci-labels
  uploads_data:
    labels: *ci-labels
  # Fixed name: PoolManager must inspect the same volume the API binds at
  # /repos. Compose would otherwise prefix it with the project name. In
  # Compose, REPO_VOLUME must be a volume name (not a host path), and it keeps
  # the API mount and PoolManager's agent bind consistent. Existing installs
  # can copy a project-prefixed volume once with:
  #   docker run --rm -v <project>_vibecode_repos:/from -v vibecode_repos:/to \
  #     alpine sh -c 'cp -a /from/. /to/'
  vibecode_repos:
    name: ${REPO_VOLUME:-vibecode_repos}
    labels: *ci-labels
