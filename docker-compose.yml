services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibecode-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@192.168.3.33:5432/vibecode
      - JWT_SECRET=${JWT_SECRET}

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibecode-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - API_URL=http://api:3001
