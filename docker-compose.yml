services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibecode-api
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:postgres${POSTGRES_PASSWORD:-postgres}@postgres:5432/vibecode
      - JWT_SECRET=${JWT_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/.env:/app/.env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibecode-frontend
    ports:
      - "3000:3000"
    environment:
      - API_URL=http://localhost:3001

  postgres:
    image: postgres:15-alpine
    container_name: vibecode-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vibecode-pgadmin
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@vibecode.local
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - postgres

networks:
  default:
    driver: bridge

volumes:
  postgres_data:
