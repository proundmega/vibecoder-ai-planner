services:
  docker-proxy:
    image: tutum/docker-socket-proxy:latest
    container_name: vibecode-docker-proxy
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
    networks:
      - vibecode
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:2375/version"]
      interval: 5s
      timeout: 3s
      retries: 3

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibecode-migrate
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vibecode
    depends_on:
      postgres:
        condition: service_healthy
    command: node src/migrations/apply.js

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibecode-api
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vibecode
      - JWT_SECRET=${JWT_SECRET}
      - DOCKER_API_URL=http://docker-proxy:2375
      - AGENT_IMAGE=vibecode-agent
      - CONTAINER_NETWORK=vibecode_default
      - REPO_VOLUME=vibecode_repos
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
    volumes:
      - uploads_data:/app/uploads
      - vibecode_repos:/repos
    networks:
      - vibecode
    depends_on:
      docker-proxy:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibecode-frontend
    restart: unless-stopped
    ports:
      - "3002:80"
    environment:
      - API_URL=http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  postgres:
    image: pgvector/pgvector:pg15
    container_name: vibecode-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=vibecode
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vibecode-pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@vibecode.dev
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-changeme}
    depends_on:
      - postgres

networks:
  default:
    driver: bridge
  vibecode:
    driver: bridge

volumes:
  postgres_data:
  uploads_data:
  vibecode_repos:
