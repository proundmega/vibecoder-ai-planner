x-ci-labels: &ci-labels
  com.vibecode.ci: "${VIBECODE_CI:-false}"
  com.vibecode.ci.job: "${VIBECODE_CI_JOB:-}"
  com.vibecode.ci.build: "${VIBECODE_CI_BUILD:-}"

services:
  api:
    environment:
      # Cypress seeds users via the API; disable login/register rate limits
      # and allow the origin the browser uses inside the compose network.
      - INTEGRATION_TESTS=1
      - ALLOWED_ORIGINS=http://frontend,http://localhost:3000,http://localhost:3002
  cypress:
    profiles: ["e2e"]
    build:
      context: ./frontend
      dockerfile: Dockerfile.cypress
      labels: *ci-labels
    environment:
      - CYPRESS_baseUrl=http://frontend
      - CYPRESS_video=false
    networks:
      - default
