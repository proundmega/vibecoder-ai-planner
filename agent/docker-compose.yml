services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://api:3001}
      - PROJECT_ID=${PROJECT_ID:-1}
      - REPO_OWNER=${REPO_OWNER}
      - REPO_NAME=${REPO_NAME}
      - AI_PROVIDER=${AI_PROVIDER:-claude}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_API_KEY=${AI_API_KEY}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-30000}
      - DRY_RUN=${DRY_RUN:-false}
      - MAX_TICKETS=${MAX_TICKETS:-1}
      # OpenCode harness (legacy remains the safe default)
      - HARNESS_MODE=${HARNESS_MODE:-legacy}
      - HARNESS_BIN=${HARNESS_BIN:-opencode}
      - HARNESS_STARTUP_TIMEOUT_MS=${HARNESS_STARTUP_TIMEOUT_MS:-30000}
      - HARNESS_MAX_DURATION_MINUTES=${HARNESS_MAX_DURATION_MINUTES:-45}
      - HARNESS_VERIFY_COMMANDS=${HARNESS_VERIFY_COMMANDS:-}
      - HARNESS_PROTECTED_PATHS=${HARNESS_PROTECTED_PATHS:-.env*;**/.env*;Jenkinsfile;**/Jenkinsfile;.github/**;**/.github/**;**/secrets/**}
      - HARNESS_MODEL=${HARNESS_MODEL:-}
      - HARNESS_MAX_FILES=${HARNESS_MAX_FILES:-50}
      - HARNESS_MAX_LINES=${HARNESS_MAX_LINES:-2000}
      - HARNESS_MAX_BYTES=${HARNESS_MAX_BYTES:-5242880}
      - HARNESS_FSCK=${HARNESS_FSCK:-true}
      - HARNESS_RETRY_PIN_ATTEMPTS=${HARNESS_RETRY_PIN_ATTEMPTS:-3}
      - HARNESS_RETRY_BASE_DELAY_MS=${HARNESS_RETRY_BASE_DELAY_MS:-60000}
      - HARNESS_RETRY_MAX_DELAY_MS=${HARNESS_RETRY_MAX_DELAY_MS:-3600000}
      # fg-34 sandbox. Slice 2 sandboxes supervisor-driven install/verification
      # commands and bridges the OpenCode bash tool into the same sandbox.
      # Docker mode needs a daemon connection (DOCKER_HOST or a socket proxy)
      # and a workspace path the daemon can bind-mount; PoolManager/compose
      # wiring is deferred to D8.
      # Do not mount /var/run/docker.sock into the sandbox itself; only the
      # supervisor talks to the daemon.
      - SANDBOX_MODE=${SANDBOX_MODE:-host}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-vibecode-agent-sandbox:latest}
      - SANDBOX_PROXY_IMAGE=${SANDBOX_PROXY_IMAGE:-vibecode-sandbox-proxy:latest}
      - SANDBOX_DOCKER_BIN=${SANDBOX_DOCKER_BIN:-docker}
      - SANDBOX_REQUIRE=${SANDBOX_REQUIRE:-false}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2.0}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-2048}
      - SANDBOX_PIDS=${SANDBOX_PIDS:-512}
      - SANDBOX_DISK_MB=${SANDBOX_DISK_MB:-5120}
      - SANDBOX_DISK_CHECK_INTERVAL_SECONDS=${SANDBOX_DISK_CHECK_INTERVAL_SECONDS:-10}
      - SANDBOX_DISK_ENFORCE=${SANDBOX_DISK_ENFORCE:-false}
      - SANDBOX_NOFILE=${SANDBOX_NOFILE:-1024}
      - SANDBOX_TMPFS_MB=${SANDBOX_TMPFS_MB:-256}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-none}
      - SANDBOX_ALLOWED_HOSTS=${SANDBOX_ALLOWED_HOSTS:-}
      - SANDBOX_EGRESS_PROXY=${SANDBOX_EGRESS_PROXY:-}
      - SANDBOX_EGRESS_UPSTREAM_NETWORK=${SANDBOX_EGRESS_UPSTREAM_NETWORK:-bridge}
      - SANDBOX_EGRESS_PROBE_TIMEOUT_MS=${SANDBOX_EGRESS_PROBE_TIMEOUT_MS:-5000}
      - SANDBOX_ENV=${SANDBOX_ENV:-}
      - SANDBOX_USER=${SANDBOX_USER:-}
      - SANDBOX_ALLOW_ROOT=${SANDBOX_ALLOW_ROOT:-false}
      - SANDBOX_EXEC_TIMEOUT_SECONDS=${SANDBOX_EXEC_TIMEOUT_SECONDS:-900}
      - SANDBOX_ARTIFACT_MAX_BYTES=${SANDBOX_ARTIFACT_MAX_BYTES:-5242880}
      - SANDBOX_SECCOMP_PROFILE=${SANDBOX_SECCOMP_PROFILE:-}
      - SANDBOX_APPARMOR_PROFILE=${SANDBOX_APPARMOR_PROFILE:-}
      - SANDBOX_CONTAINER_WORKSPACE_ROOT=${SANDBOX_CONTAINER_WORKSPACE_ROOT:-/repos}
      - SANDBOX_HOST_WORKSPACE_ROOT=${SANDBOX_HOST_WORKSPACE_ROOT:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vibecode
    deploy:
      resources:
        limits:
          # JVM + Node + npm install + Vitest need more than 512M.
          memory: 2G
          cpus: '2.0'

  api:
    external: true
    name: vibecode-api

networks:
  vibecode:
    driver: bridge
