services:
  # fg-54: one supervisor per host. It enrolls the node, declares the runtimes
  # in agent.ini, and reconciles one child JVM per runtime. No secrets live in
  # agent.ini; provider keys are fetched per runtime over the node channel.
  supervisor:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - SUPERVISOR_CONFIG=/config/agent.ini
      - AGENT_JAR=/app/agent.jar
      - ENROLLMENT_TOKEN=${ENROLLMENT_TOKEN:-}
      - ENROLLMENT_URL=${ENROLLMENT_URL:-}
      - AGENT_CREDENTIALS_FILE=${AGENT_CREDENTIALS_FILE:-/credentials/node.json}
      - AGENT_NODE_NAME=${AGENT_NODE_NAME:-}
      # Local Compose uses http://api; enrollment refuses non-loopback HTTP
      # unless this is explicitly enabled. Use HTTPS in production.
      - ALLOW_INSECURE_AGENT_ENROLLMENT=${ALLOW_INSECURE_AGENT_ENROLLMENT:-0}
      - BACKEND_URL=${BACKEND_URL:-http://api:3001}
      # Explicit local-development PAT fallback. The backend report's authMode
      # is not enough on its own: the agent refuses PAT mode unless this flag is
      # set (see AGENTS.md / fg-35).
      - GITHUB_AUTH_MODE=${GITHUB_AUTH_MODE:-app}
      - ALLOW_PAT=${ALLOW_PAT:-false}
      # Optional documented local fallback when the backend repo credential is
      # unavailable. The backend PAT is still preferred when both exist.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GIT_TOKEN=${GIT_TOKEN:-}
      # Per-child heap and the host budget; the supervisor divides the budget
      # across the declared runtime count.
      - AGENT_RUNTIME_HEAP_MB=${AGENT_RUNTIME_HEAP_MB:-768}
      - SUPERVISOR_MEMORY_BUDGET_MB=${SUPERVISOR_MEMORY_BUDGET_MB:-0}
      - SUPERVISOR_STOP_TIMEOUT_SECONDS=${SUPERVISOR_STOP_TIMEOUT_SECONDS:-10}
      # fg-56: startup health gate and post-start monitor. Set REQUIRED=false
      # only for an offline local run.
      - SUPERVISOR_HEALTH_REQUIRED=${SUPERVISOR_HEALTH_REQUIRED:-true}
      - SUPERVISOR_HEALTH_TIMEOUT_SECONDS=${SUPERVISOR_HEALTH_TIMEOUT_SECONDS:-120}
      - SUPERVISOR_HEALTH_INTERVAL_SECONDS=${SUPERVISOR_HEALTH_INTERVAL_SECONDS:-2}
      - SUPERVISOR_HEALTH_MONITOR_ENABLED=${SUPERVISOR_HEALTH_MONITOR_ENABLED:-true}
      - SUPERVISOR_HEALTH_MONITOR_INTERVAL_SECONDS=${SUPERVISOR_HEALTH_MONITOR_INTERVAL_SECONDS:-10}
      - SUPERVISOR_HEALTH_MONITOR_MAX_BACKOFF_SECONDS=${SUPERVISOR_HEALTH_MONITOR_MAX_BACKOFF_SECONDS:-60}
      # fg-43: host-init.sh writes the declared slot count; the supervisor
      # refuses to start if agent.ini later grows beyond it. 0 disables the
      # guard for a hand-managed host.
      - AGENT_HOST_MAX_RUNTIMES=${AGENT_HOST_MAX_RUNTIMES:-50}
      - AGENT_DISK_BUDGET_GB=${AGENT_DISK_BUDGET_GB:-}
      - HARNESS_WORKSPACE_RETENTION_HOURS=${HARNESS_WORKSPACE_RETENTION_HOURS:-24}
      # fg-58: storage lifecycle. The supervisor refreshes idle runtimes,
      # samples disk and inodes, sweeps old roots/orphans and prunes images.
      - AGENT_IDLE_REFRESH_MS=${AGENT_IDLE_REFRESH_MS:-7200000}
      - AGENT_MAX_LIFETIME_HOURS=${AGENT_MAX_LIFETIME_HOURS:-24}
      - AGENT_STORAGE_CHECK_SECONDS=${AGENT_STORAGE_CHECK_SECONDS:-60}
      - AGENT_STORAGE_METER_SECONDS=${AGENT_STORAGE_METER_SECONDS:-300}
      - AGENT_STORAGE_WARN_PCT=${AGENT_STORAGE_WARN_PCT:-70}
      - AGENT_STORAGE_STOP_PCT=${AGENT_STORAGE_STOP_PCT:-80}
      - AGENT_STORAGE_CLEAN_PCT=${AGENT_STORAGE_CLEAN_PCT:-85}
      - AGENT_STORAGE_RECYCLE_PCT=${AGENT_STORAGE_RECYCLE_PCT:-90}
      - AGENT_STORAGE_MANUAL_PCT=${AGENT_STORAGE_MANUAL_PCT:-95}
      - AGENT_STORAGE_MAX_INODES=${AGENT_STORAGE_MAX_INODES:-0}
      - AGENT_ORPHAN_TTL_HOURS=${AGENT_ORPHAN_TTL_HOURS:-24}
      - AGENT_IMAGE_PRUNE_ENABLED=${AGENT_IMAGE_PRUNE_ENABLED:-}
      - AGENT_IMAGE_PRUNE_TIMEOUT_SECONDS=${AGENT_IMAGE_PRUNE_TIMEOUT_SECONDS:-30}
      - REPO_OWNER=${REPO_OWNER:-}
      - REPO_NAME=${REPO_NAME:-}
      - REPO_CLONE_DIR=${REPO_CLONE_DIR:-/repos}
      # Local filesystem Git repositories (D13). The root must be mounted at
      # the same absolute path as the API, and writable by uid 100 for pushes.
      - GIT_LOCAL_ROOT=${GIT_LOCAL_ROOT:-}
      - AI_PROVIDER=${AI_PROVIDER:-claude}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-30000}
      - DRY_RUN=${DRY_RUN:-false}
      - MAX_TICKETS=${MAX_TICKETS:-1}
      - HARNESS_BIN=${HARNESS_BIN:-opencode}
      - HARNESS_STARTUP_TIMEOUT_MS=${HARNESS_STARTUP_TIMEOUT_MS:-30000}
      - HARNESS_MAX_DURATION_MINUTES=${HARNESS_MAX_DURATION_MINUTES:-45}
      - HARNESS_VERIFY_COMMANDS=${HARNESS_VERIFY_COMMANDS:-}
      - HARNESS_PROTECTED_PATHS=${HARNESS_PROTECTED_PATHS:-.env*;**/.env*;Jenkinsfile;**/Jenkinsfile;.github/**;**/.github/**;**/secrets/**}
      - HARNESS_MODEL=${HARNESS_MODEL:-}
      - HARNESS_MAX_FILES=${HARNESS_MAX_FILES:-50}
      - HARNESS_MAX_LINES=${HARNESS_MAX_LINES:-2000}
      - HARNESS_MAX_BYTES=${HARNESS_MAX_BYTES:-5242880}
      - HARNESS_FSCK=${HARNESS_FSCK:-true}
      - HARNESS_RETRY_PIN_ATTEMPTS=${HARNESS_RETRY_PIN_ATTEMPTS:-3}
      - HARNESS_RETRY_BASE_DELAY_MS=${HARNESS_RETRY_BASE_DELAY_MS:-60000}
      - HARNESS_RETRY_MAX_DELAY_MS=${HARNESS_RETRY_MAX_DELAY_MS:-3600000}
      # fg-34 sandbox. Slice 2 sandboxes supervisor-driven install/verification
      # commands and bridges the OpenCode bash tool into the same sandbox.
      # Docker mode needs a daemon connection (DOCKER_HOST pointing at a
      # restricted socket proxy) and SANDBOX_HOST_WORKSPACE_ROOT set to the
      # host path the daemon can bind-mount. PoolManager derives both for pool
      # agents; this standalone compose file requires them explicitly. For
      # Docker mode, also use agent/docker-compose.sandbox.yml so the agent
      # joins the restricted proxy network. Set SANDBOX_HOST_WORKSPACE_ROOT to
      # the absolute host path mounted at /repos below (REPO_HOST_PATH). Do not
      # mount /var/run/docker.sock into the sandbox itself; only the supervisor
      # talks to the daemon.
      - SANDBOX_MODE=${SANDBOX_MODE:-host}
      - SANDBOX_IMAGE=${SANDBOX_IMAGE:-vibecode-agent-sandbox:latest}
      - SANDBOX_PROXY_IMAGE=${SANDBOX_PROXY_IMAGE:-vibecode-sandbox-proxy:latest}
      - SANDBOX_DOCKER_BIN=${SANDBOX_DOCKER_BIN:-docker}
      - SANDBOX_REQUIRE=${SANDBOX_REQUIRE:-false}
      - SANDBOX_REQUIRE_SECURE_FILE_ACCESS=${SANDBOX_REQUIRE_SECURE_FILE_ACCESS:-false}
      - SANDBOX_CPUS=${SANDBOX_CPUS:-2.0}
      - SANDBOX_MEMORY_MB=${SANDBOX_MEMORY_MB:-2048}
      - SANDBOX_PIDS=${SANDBOX_PIDS:-512}
      - SANDBOX_DISK_MB=${SANDBOX_DISK_MB:-5120}
      - SANDBOX_DISK_CHECK_INTERVAL_SECONDS=${SANDBOX_DISK_CHECK_INTERVAL_SECONDS:-10}
      - SANDBOX_CACHE_MAX_MB=${SANDBOX_CACHE_MAX_MB:-2048}
      - SANDBOX_CACHE_RETENTION_DAYS=${SANDBOX_CACHE_RETENTION_DAYS:-14}
      - SANDBOX_DISK_ENFORCE=${SANDBOX_DISK_ENFORCE:-false}
      - SANDBOX_NOFILE=${SANDBOX_NOFILE:-1024}
      - SANDBOX_TMPFS_MB=${SANDBOX_TMPFS_MB:-256}
      - SANDBOX_NETWORK=${SANDBOX_NETWORK:-none}
      - SANDBOX_ALLOWED_HOSTS=${SANDBOX_ALLOWED_HOSTS:-}
      - SANDBOX_EGRESS_PROXY=${SANDBOX_EGRESS_PROXY:-}
      - SANDBOX_EGRESS_UPSTREAM_NETWORK=${SANDBOX_EGRESS_UPSTREAM_NETWORK:-bridge}
      - SANDBOX_EGRESS_PROBE_TIMEOUT_MS=${SANDBOX_EGRESS_PROBE_TIMEOUT_MS:-5000}
      - SANDBOX_EGRESS_TLS_MODE=${SANDBOX_EGRESS_TLS_MODE:-sni-only}
      - SANDBOX_EGRESS_ORIGIN_CA_HOSTS=${SANDBOX_EGRESS_ORIGIN_CA_HOSTS:-}
      - SANDBOX_EGRESS_ORIGIN_CA_B64=${SANDBOX_EGRESS_ORIGIN_CA_B64:-}
      - SANDBOX_ENV=${SANDBOX_ENV:-}
      - SANDBOX_USER=${SANDBOX_USER:-}
      - SANDBOX_ALLOW_ROOT=${SANDBOX_ALLOW_ROOT:-false}
      - SANDBOX_EXEC_TIMEOUT_SECONDS=${SANDBOX_EXEC_TIMEOUT_SECONDS:-900}
      - SANDBOX_ARTIFACT_MAX_BYTES=${SANDBOX_ARTIFACT_MAX_BYTES:-5242880}
      - SANDBOX_SECCOMP_PROFILE=${SANDBOX_SECCOMP_PROFILE:-}
      - SANDBOX_APPARMOR_PROFILE=${SANDBOX_APPARMOR_PROFILE:-}
      - SANDBOX_CONTAINER_WORKSPACE_ROOT=${SANDBOX_CONTAINER_WORKSPACE_ROOT:-/repos}
      - SANDBOX_HOST_WORKSPACE_ROOT=${SANDBOX_HOST_WORKSPACE_ROOT:-}
    volumes:
      # Declared runtimes only: roles, model refs, counts, optional effort.
      # Never put API keys or tokens here.
      - ${AGENT_INI_PATH:-./agent.ini}:/config/agent.ini:ro
      # Host-visible workspace: the daemon resolves this bind, not the agent
      # container. SANDBOX_HOST_WORKSPACE_ROOT must match its absolute path.
      # The bind is host-owned; make it writable by the agent user (uid 100,
      # gid 101), for example: mkdir -p repos && chown 100:101 repos
      - ${REPO_HOST_PATH:-./repos}:/repos
      # D13 local Git root: same host path and target as the API. Make it
      # writable by the agent user: chown -R 100:101 <host path>
      - ${GIT_LOCAL_ROOT_HOST_PATH:-/srv/git}:${GIT_LOCAL_ROOT:-/srv/git}
      - agent_credentials:/credentials
    restart: unless-stopped
    networks:
      # Host mode joins only the API network. Docker mode adds the restricted
      # proxy network through agent/docker-compose.sandbox.yml.
      - vibecode
    logging:
      driver: json-file
      options:
        max-size: ${AGENT_LOG_MAX_SIZE:-10m}
        max-file: ${AGENT_LOG_MAX_FILE:-3}
    deploy:
      resources:
        limits:
          # host-init.sh writes the size for the declared fleet. The defaults
          # keep a single hand-managed runtime working.
          memory: ${SUPERVISOR_MEMORY_LIMIT:-2G}
          cpus: '${SUPERVISOR_CPUS:-2.0}'

volumes:
  # Persisted node credentials (0600). Recreating the container keeps the node
  # identity; removing the volume requires a new join token.
  agent_credentials:

networks:
  # The API's Compose network, so BACKEND_URL=http://api:3001 resolves.
  # ROOT_COMPOSE_PROJECT is the root project name; override VIBECODE_NETWORK
  # when the actual network differs, e.g. VIBECODE_NETWORK=myproj_default.
  vibecode:
    external: true
    name: ${VIBECODE_NETWORK:-${ROOT_COMPOSE_PROJECT:-vibecode}_default}
