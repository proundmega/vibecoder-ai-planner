services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - AGENT_API_KEY=${AGENT_API_KEY}
      - BACKEND_URL=${BACKEND_URL:-http://api:3001}
      - PROJECT_ID=${PROJECT_ID:-1}
      - REPO_OWNER=${REPO_OWNER}
      - REPO_NAME=${REPO_NAME}
      - AI_PROVIDER=${AI_PROVIDER:-claude}
      - AI_MODEL=${AI_MODEL:-claude-sonnet-4-20250514}
      - AI_API_KEY=${AI_API_KEY}
      - POLL_INTERVAL_MS=${POLL_INTERVAL_MS:-30000}
      - DRY_RUN=${DRY_RUN:-false}
      - MAX_TICKETS=${MAX_TICKETS:-1}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - vibecode
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

  api:
    external: true
    name: vibecode-api

networks:
  vibecode:
    driver: bridge
