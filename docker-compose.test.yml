services:
  api:
    environment:
      - INTEGRATION_TESTS=1
    # CI integration tests need direct Docker socket access (not via docker-proxy)
    # The test container mounts the host socket directly
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  postgres:
    ports:
      - "5432:5432"

  test:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    restart: "no"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/app/compose:ro
    networks:
      - default
    environment:
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-changeme}@postgres:5432/vibecode
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      - JWT_SECRET=${JWT_SECRET:-jenkins-ci-secret-for-testing-purposes-2026}
      - REDIS_URL=redis://redis:6379
      - NODE_ENV=test
      - BASE_URL=http://api:3001
      - FRONTEND_URL=http://frontend:80
      - CI=1
      - COMPOSE_PROJECT_NAME=${COMPOSE_PROJECT_NAME:-vibecode}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    command: sleep infinity
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '1.0'

networks:
  default:
    driver: bridge
